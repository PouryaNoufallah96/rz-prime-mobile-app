name: gainx
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  collection: ^1.19.1
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3
  flutter_svg: ^2.2.0
  freezed_annotation: ^2.4.4
  go_router: ^16.1.0
  google_fonts: ^6.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hydrated_bloc: ^10.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  reown_appkit: ^1.5.0
  reown_walletkit: ^1.2.0
  rxdart: ^0.28.0
  toastification: ^3.0.3

dev_dependencies:
  build_runner: ^2.5.4
  flutter_gen_runner: ^5.10.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  hive_generator: ^2.0.1
  json_serializable: ^6.9.0
  very_good_analysis: ^9.0.0

flutter_gen:
  output: lib/gen

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: CentraNo1-Bold
      fonts:
        - asset: assets/fonts/CentraNo1-Bold.ttf
    - family: CentraNo1-Medium
      fonts:
        - asset: assets/fonts/CentraNo1-Medium.ttf
    - family: CentraNo1-Book
      fonts:
        - asset: assets/fonts/CentraNo1-Book.ttf
